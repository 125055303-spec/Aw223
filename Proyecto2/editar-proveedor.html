
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weirdo Comics - Editar proveedor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="contenedor-app">

    <!-- MENÚ LATERAL -->
    <aside class="menu-lateral">

        <div class="logo-contenedor">
            <img class="logo" src="imagenes/logo.png" alt="Weirdo Comics">
        </div>

        <nav class="nav-menu">

            <a href="index.html">
                <img src="imagenes/home.png" alt="">
                <span>Inicio</span>
            </a>

            <a href="usuarios.html">
                <img src="imagenes/usuarioa.png" alt="">
                <span>Usuarios</span>
            </a>

            <a href="roles.html">
                <img src="imagenes/users.png" alt="">
                <span>Roles y permisos</span>
            </a>

            <a href="productos.html">
                <img src="imagenes/products.png" alt="">
                <span>Productos</span>
            </a>

            <a href="ventas.html">
                <img src="imagenes/ventas.png" alt="">
                <span>Ventas</span>
            </a>

            <a href="inventario.html">
                <img src="imagenes/inventario.png" alt="">
                <span>Inventario</span>
            </a>

            <a href="proveedores.html" class="activo">
                <img src="imagenes/proveedores.png" alt="">
                <span>Proveedores</span>
            </a>

            <a href="reportes.html">
                <img src="imagenes/reportes.png" alt="">
                <span>Reportes</span>
            </a>

            <a href="configuracion.html">
                <img src="imagenes/configuracion.png" alt="">
                <span>Configuración</span>
            </a>

        </nav>

        <!-- PERFIL -->
        <div class="perfil-sidebar">

            <i class="perfil-icono"></i>

            <div class="perfil-texto">
                <strong>Admin</strong>
                <small>Administrador</small>
            </div>

        </div>

    </aside>


    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenido-principal">

        <header class="encabezado-superior">

            <div>
                <h1 class="titulo">Editar proveedor</h1>
                <p class="inventario-descripcion">
                    Modifica la información del proveedor registrado
                </p>
            </div>

            <a href="perfil.html" class="avatar">L</a>

        </header>


        <!-- FORMULARIO -->
        <div class="distribucion">

            <!-- COLUMNA IZQUIERDA -->
            <div class="columna-izquierda left">

                <img class="imagen-grande big"
                     src="imagenes/panini.jpeg"
                     alt="Imagen del proveedor">

                <p>Imagen del proveedor</p>

                <small>Editorial Panini</small>

            </div>


            <!-- COLUMNA DERECHA -->
            <div class="formulario form">

                <div class="campo completo">
                    <label>ID del proveedor</label>
                    <input class="naranja" type="text"
                           value="PRO-001" readonly>
                </div>

                <div class="campo completo">
                    <label>Nombre del proveedor</label>
                    <input class="naranja" type="text"
                           value="Editorial Panini">
                </div>

                <div class="campo completo">
                    <label>Correo de contacto</label>
                    <input class="naranja" type="email"
                           value="contacto@panini.com">
                </div>

                <div class="campo">
                    <label>Teléfono</label>
                    <input class="naranja" type="tel"
                           value="442 123 4567">
                </div>

                <div class="campo">
                    <label>Productos registrados</label>
                    <input class="naranja" type="number"
                           value="19" readonly>
                </div>

                <div class="campo">
                    <label>Estado</label>
                    <select class="naranja">
                        <option selected>Activo</option>
                        <option>Inactivo</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Ciudad</label>
                    <input class="naranja" type="text"
                           placeholder="Ciudad del proveedor">
                </div>

                <div class="campo completo">
                    <label>Dirección</label>
                    <input class="naranja" type="text"
                           placeholder="Dirección del proveedor">
                </div>

                <div class="campo completo">
                    <label>Descripción u observaciones</label>
                    <textarea class="naranja" rows="3"
                              placeholder="Información adicional del proveedor"></textarea>
                </div>


                <!-- BOTONES -->
                <div class="configuracion-botones">

                    <a href="proveedores.html" class="boton rosa">
                        Cancelar
                    </a>

                    <button class="boton rosa" type="button">
                        Guardar cambios
                    </button>

                </div>

            </div>

        </div>

    </main>

</div>

</body>
</html>
