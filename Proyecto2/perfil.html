<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weirdo Comics - Perfil</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="contenedor-app">

    <!-- MENÚ LATERAL -->
    <aside class="menu-lateral">
        <div class="logo-contenedor">
            <img class="logo" src="imagenes/logo.png" alt="Weirdo Comics">
        </div>
        <nav class="nav-menu">
            <a href="index.html">
                <img src="imagenes/home.png" alt=""> <span>Inicio</span>
            </a>
            <a href="usuarios.html">
                <img src="imagenes/usuarioa.png" alt=""> <span>Usuarios</span>
            </a>
            <a href="roles.html">
                <img src="imagenes/users.png" alt=""> <span>Roles y permisos</span>
            </a>
            <a href="productos.html">
                <img src="imagenes/products.png" alt=""> <span>Productos</span>
            </a>
            <a href="ventas.html">
                <img src="imagenes/ventas.png" alt=""> <span>Ventas</span>
            </a>
            <a href="inventario.html">
                <img src="imagenes/inventario.png" alt=""> <span>Inventario</span>
            </a>
            <a href="proveedores.html">
                <img src="imagenes/proveedores.png" alt=""> <span>Proveedores</span>
            </a>
            <a href="reportes.html">
                <img src="imagenes/reportes.png" alt=""> <span>Reportes</span>
            </a>
            <a href="configuracion.html">
                <img src="imagenes/configuracion.png" alt=""> <span>Configuración</span>
            </a>
        </nav>
        <!-- PERFIL -->
        <div class="perfil-sidebar">
            <i class="perfil-icono"></i>
            <div class="perfil-texto">
                <strong>Admin</strong>
                <small>Administrador</small>
            </div>
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenido-principal">
        <header class="encabezado-superior">
            <div><h1 class="titulo">Mi perfil</h1><p class="inventario-descripcion">Consulta y actualiza tus datos personales</p></div>
            <a href="perfil.html" class="avatar">L</a>
        </header>
        <div class="distribucion">
            <div class="columna-izquierda left">
                <div class="circulo">L</div>
                <p class="texto-foto">Cambiar foto de perfil</p>
                <button class="boton">Guardar cambios</button>
            </div>
            <div class="formulario form">
                <div class="campo completo"><label>Nombre completo</label><input class="naranja completo" type="text" placeholder="Nombre completo"></div>
                <div class="campo completo"><label>Nombre de usuario</label><input class="celeste completo" type="text" placeholder="Nombre de usuario"></div>
                <div class="campo completo"><label>Correo electrónico</label><input class="naranja completo" type="email" placeholder="Correo electrónico"></div>
                <div class="campo completo"><label>Teléfono</label><input class="rosa completo" type="tel" placeholder="Teléfono"></div>
                <div class="campo completo"><label>Último acceso</label><input class="celeste completo" type="text" placeholder="Último acceso"></div>
                <div class="campo"><label>Rol</label><input class="naranja" type="text" placeholder="Rol"></div>
                <div class="campo"><label>Estado</label><input class="rosa" type="text" placeholder="Estado"></div>

            </div>
        </div>

    </main>

</div>
</body>
</html>
