<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weirdo Comics - Agregar producto</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="contenedor-app">

    <!-- MENÚ LATERAL -->
    <aside class="menu-lateral">
        <div class="logo-contenedor">
            <img class="logo" src="imagenes/logo.png" alt="Weirdo Comics">
        </div>
        <nav class="nav-menu">
            <a href="index.html">
                <img src="imagenes/home.png" alt=""> <span>Inicio</span>
            </a>
            <a href="usuarios.html">
                <img src="imagenes/usuarioa.png" alt=""> <span>Usuarios</span>
            </a>
            <a href="roles.html">
                <img src="imagenes/users.png" alt=""> <span>Roles y permisos</span>
            </a>
            <a href="productos.html" class="activo">
                <img src="imagenes/products.png" alt=""> <span>Productos</span>
            </a>
            <a href="ventas.html">
                <img src="imagenes/ventas.png" alt=""> <span>Ventas</span>
            </a>
            <a href="inventario.html">
                <img src="imagenes/inventario.png" alt=""> <span>Inventario</span>
            </a>
            <a href="proveedores.html">
                <img src="imagenes/proveedores.png" alt=""> <span>Proveedores</span>
            </a>
            <a href="reportes.html">
                <img src="imagenes/reportes.png" alt=""> <span>Reportes</span>
            </a>
            <a href="configuracion.html">
                <img src="imagenes/configuracion.png" alt=""> <span>Configuración</span>
            </a>
        </nav>
        <!-- PERFIL -->
        <div class="perfil-sidebar">
            <i class="perfil-icono"></i>
            <div class="perfil-texto">
                <strong>Admin</strong>
                <small>Administrador</small>
            </div>
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="contenido-principal">
        <header class="encabezado-superior">
            <div><h1 class="titulo">Agregar producto</h1><p class="inventario-descripcion">Registra un nuevo cómic o producto en el catálogo</p></div>
            <a href="perfil.html" class="avatar">L</a>
        </header>
        <div class="distribucion">
            <div class="columna-izquierda left">
                <img class="imagen-grande big" src="imagenes/image.png" alt="Imagen del producto">
                <p>Imagen del producto</p>
            </div>
            <div class="formulario form">
                <div class="campo completo"><label>Nombre del producto</label><input class="naranja" type="text" placeholder="Nombre del producto"></div>
                <div class="campo completo"><label>Descripción</label><input class="naranja" type="text" placeholder="Descripción"></div>
                <div class="campo"><label>Autor</label><input class="naranja" type="text" placeholder="Autor"></div>
                <div class="campo"><label>Editorial</label><input class="naranja" type="text" placeholder="Editorial"></div>
                <div class="campo"><label>Categoría</label><input class="naranja" type="text" placeholder="Categoría"></div>
                <div class="campo"><label>Estado</label><input class="naranja" type="text" placeholder="Estado"></div>
                <div class="campo"><label>Precio</label><input class="naranja" type="number" placeholder="Precio"></div>
                <div class="campo"><label>Cantidad en stock</label><input class="naranja" type="number" placeholder="Cantidad en stock"></div>
                <div class="campo"><label>Código</label><input class="naranja" type="text" placeholder="Código"></div>
                <div class="campo"><label>Idioma</label><input class="naranja" type="text" placeholder="Idioma"></div>
                <div class="configuracion-botones"><button class="boton rosa" type="button">Cancelar</button><button class="boton rosa" type="button">Guardar producto</button></div>
            </div>
        </div>

    </main>

</div>
</body>
</html>
